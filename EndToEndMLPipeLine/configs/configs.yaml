# configs/config.yaml
# -------------------
# Single source of truth for every hardcoded value in the notebook.
# All modules read from here. Change a value once — it propagates everywhere.
#
# Notebook source for each value is noted in comments.

data:
  raw_path: data/raw/sa_spam_dataset_100k.csv   # replaces: from google.colab import files
  processed_path: data/processed/
  test_size: 0.2                            # notebook §5: test_size=0.2

features:
  max_features: 10000                       # notebook §5: max_features=5000 (increased)
  ngram_range: [1, 2]                       # notebook §5: ngram_range=(1, 2)
  sublinear_tf: true                        # notebook §5: sublinear_tf=True
  min_df: 2                                 # notebook §5: min_df=2
  max_df: 0.95                              # notebook §5: max_df=0.95

models:
  random_state: 42                          # notebook §1: RANDOM_STATE = 42
  lr_C: 1.0                                 # notebook §6.1: C=1.0
  lr_solver: liblinear                      # notebook §6.1: solver='liblinear'
  lr_max_iter: 1000                         # notebook §6.1: max_iter=1000
  nb_alpha: 1.0                             # notebook §6.2: alpha=1.0
  svm_C: 1.0                                # notebook §6.3: C=1.0
  svm_max_iter: 1000                        # notebook §6.3: max_iter=1000
  voting: hard                              # notebook §7: voting='hard'

thresholds:
  # A model only enters the MLflow registry if ALL three are met.
  # Replaces: notebook §10 saves every model regardless of performance.
  min_f1: 0.92
  min_precision: 0.90
  min_recall: 0.90